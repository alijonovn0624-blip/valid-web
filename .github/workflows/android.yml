name: Build Android APK
on:
  workflow_dispatch:
  push:
    tags: ['app-v*']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Sayt manzilini qo'yish
        run: |
          # GitHub: Settings > Secrets and variables > Actions > Variables > SITE_URL
          node -e "const f='capacitor.config.json';const c=require('./'+f);c.server.url=process.env.SITE_URL;require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk D-Education.apk
      - uses: actions/upload-artifact@v4
        with: { name: D-Education-apk, path: D-Education.apk }
      - name: Release (latest)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG="app-v$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" D-Education.apk --title "D-Education $TAG" --notes "Android APK" --latest
